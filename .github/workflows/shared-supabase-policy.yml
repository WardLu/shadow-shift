name: Shared Supabase Policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shared-supabase-policy:
    name: Shared Supabase Policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check migration policy
        shell: bash
        env:
          # Shadow Shift 的 Supabase 迁移位于 app 私有子模块；子模块自身也有同名门禁。
          MIGRATION_PATH: app/supabase/migrations
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          changed_migrations="$(git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- "$MIGRATION_PATH" || true)"
          if [[ -n "$changed_migrations" ]]; then
            echo "Product repositories may not add or modify executable files under ${MIGRATION_PATH}."
            echo "$changed_migrations"
            exit 1
          fi

          if git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- . ':(exclude).github/workflows/shared-supabase-policy.yml' | grep -nE 'supabase db push|supabase db query --linked|supabase migration repair|supabase db reset --linked|SUPABASE_DB_PASSWORD|SUPABASE_ACCESS_TOKEN'; then
            echo "Direct production migration or migration-repair commands are forbidden in product repositories."
            exit 1
          fi

          echo "Shared Supabase policy passed (local private-repository adapter)."
