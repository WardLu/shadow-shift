name: Shared Supabase Policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shared-supabase-policy:
    name: Shared Supabase Policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check migration policy
        shell: bash
        env:
          # Shadow Shift 的 Supabase 迁移位于 app 私有子模块；子模块自身也有同名门禁。
          MIGRATION_PATH: app/supabase/migrations
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          changed_migrations="$(git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- "$MIGRATION_PATH" || true)"
          if [[ -n "$changed_migrations" ]]; then
            echo "Product repositories may not add or modify executable files under ${MIGRATION_PATH}."
            echo "$changed_migrations"
            exit 1
          fi

          # Forbidden-command rule: shadow-devkit templates/ci/shared-supabase-policy.mjs, copied to scripts/ci/; the local equivalent gate runs the same script.
          node scripts/ci/shared-supabase-policy.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

          echo "Shared Supabase policy passed (local private-repository adapter)."
