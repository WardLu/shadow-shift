<svg width="480" height="120" viewBox="0 0 480 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="hTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="55%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="hGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- ICON: layered doc shift (方案03) -->
  <g opacity="0.3">
    <rect x="22" y="58" width="52" height="40" rx="6" stroke="#3b82f6" stroke-width="2.5" fill="none" />
    <line x1="30" y1="68" x2="60" y2="68" stroke="#3b82f6" stroke-width="2" opacity="0.6" />
    <line x1="30" y1="76" x2="54" y2="76" stroke="#3b82f6" stroke-width="2" opacity="0.6" />
    <line x1="30" y1="84" x2="58" y2="84" stroke="#3b82f6" stroke-width="2" opacity="0.6" />
  </g>
  <g opacity="0.55">
    <rect x="32" y="44" width="52" height="40" rx="6" stroke="#4f46e5" stroke-width="2.5" fill="none" />
    <line x1="40" y1="54" x2="70" y2="54" stroke="#4f46e5" stroke-width="2" opacity="0.7" />
    <line x1="40" y1="62" x2="64" y2="62" stroke="#4f46e5" stroke-width="2" opacity="0.7" />
    <line x1="40" y1="70" x2="68" y2="70" stroke="#4f46e5" stroke-width="2" opacity="0.7" />
  </g>
  <rect x="42" y="30" width="52" height="40" rx="6" stroke="url(#hGrad)" stroke-width="3" fill="none" filter="url(#hGlow)" />
  <line x1="50" y1="40" x2="80" y2="40" stroke="url(#hGrad)" stroke-width="2.5" />
  <line x1="50" y1="48" x2="74" y2="48" stroke="url(#hGrad)" stroke-width="2.5" />
  <line x1="50" y1="56" x2="78" y2="56" stroke="url(#hGrad)" stroke-width="2.5" />
  <path d="M16 96 L 26 86" stroke="#22d3ee" stroke-width="2" opacity="0.6" stroke-linecap="round" stroke-dasharray="3 3" />
  <path d="M96 18 L 106 8" stroke="#a855f7" stroke-width="2" opacity="0.6" stroke-linecap="round" stroke-dasharray="3 3" />
  <circle cx="94" cy="30" r="4.5" fill="#fff" />
  <circle cx="22" cy="96" r="3.5" fill="#fff" opacity="0.6" />
  <!-- TEXT -->
  <text x="150" y="56" font-family="-apple-system, 'PingFang SC', 'SF Pro Display', system-ui, sans-serif" font-size="44" font-weight="700" fill="url(#hTextGrad)" letter-spacing="2">影迁</text>
  <text x="152" y="84" font-family="-apple-system, 'SF Pro Display', system-ui, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" letter-spacing="2.5">Shadow Shift</text>
</svg>
