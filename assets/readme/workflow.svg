<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="wfTitle wfDesc">
  <title id="wfTitle">三步迁移流程</title>
  <desc id="wfDesc">从 WizNote 下载笔记，经五步格式化，到 Obsidian 打开的三阶段流程图。</desc>
  <defs>
    <linearGradient id="wg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="wgBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0.5"/>
    </linearGradient>
    <marker id="warrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/>
    </marker>
  </defs>

  <rect width="1200" height="340" rx="26" fill="#030712"/>
  <rect x="1.5" y="1.5" width="1197" height="337" rx="25" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- STAGE 1: download -->
  <g transform="translate(56 48)">
    <rect width="312" height="244" rx="16" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>
    <text x="24" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="26" font-weight="700" fill="#e2e8f0">① 下载</text>
    <text x="24" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#22d3ee">wiznote_downloader.py</text>
    <!-- doc stack icon -->
    <g transform="translate(24 96)">
      <rect x="0" y="20" width="70" height="52" rx="7" stroke="#3b82f6" stroke-width="2.5" fill="none" opacity="0.35"/>
      <rect x="12" y="10" width="70" height="52" rx="7" stroke="#4f46e5" stroke-width="2.5" fill="none" opacity="0.6"/>
      <rect x="24" y="0" width="70" height="52" rx="7" stroke="url(#wg)" stroke-width="3" fill="none"/>
      <line x1="34" y1="14" x2="84" y2="14" stroke="url(#wg)" stroke-width="2.5"/>
      <line x1="34" y1="24" x2="76" y2="24" stroke="url(#wg)" stroke-width="2.5"/>
      <line x1="34" y1="34" x2="80" y2="34" stroke="url(#wg)" stroke-width="2.5"/>
    </g>
    <text x="120" y="130" font-family="-apple-system,'PingFang SC','Segoe UI',sans-serif" font-size="17" fill="#94a3b8">WizNote 云端</text>
    <text x="120" y="154" font-family="-apple-system,'PingFang SC','Segoe UI',sans-serif" font-size="17" fill="#94a3b8">登录 · 扫描 · 下载</text>
    <text x="120" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#64748b">→ wiznote_download/</text>
  </g>

  <!-- arrow 1 -->
  <line x1="376" y1="170" x2="436" y2="170" stroke="#818cf8" stroke-width="2.5" marker-end="url(#warrow)"/>

  <!-- STAGE 2: format -->
  <g transform="translate(444 48)">
    <rect width="312" height="244" rx="16" fill="#0b1120" stroke="url(#wgBorder)" stroke-width="1.5"/>
    <text x="24" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="26" font-weight="700" fill="url(#wg)">② 格式化</text>
    <text x="24" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#22d3ee">obsidian_formatter.py</text>
    <!-- 5-step pipeline -->
    <g transform="translate(24 104)" font-family="-apple-system,'PingFang SC','Segoe UI',sans-serif" font-size="16" font-weight="500">
      <g><circle cx="10" cy="10" r="10" fill="none" stroke="url(#wg)" stroke-width="2.5"/><text x="10" y="15" text-anchor="middle" fill="#22d3ee" font-size="14">1</text><text x="30" y="15" fill="#cbd5e1">语法检查</text></g>
      <g transform="translate(0 30)"><circle cx="10" cy="10" r="10" fill="none" stroke="url(#wg)" stroke-width="2.5"/><text x="10" y="15" text-anchor="middle" fill="#818cf8" font-size="14">2</text><text x="30" y="15" fill="#cbd5e1">格式修复</text></g>
      <g transform="translate(0 60)"><circle cx="10" cy="10" r="10" fill="none" stroke="url(#wg)" stroke-width="2.5"/><text x="10" y="15" text-anchor="middle" fill="#818cf8" font-size="14">3</text><text x="30" y="15" fill="#cbd5e1">链接转换 → WikiLinks</text></g>
      <g transform="translate(0 90)"><circle cx="10" cy="10" r="10" fill="none" stroke="url(#wg)" stroke-width="2.5"/><text x="10" y="15" text-anchor="middle" fill="#a855f7" font-size="14">4</text><text x="30" y="15" fill="#cbd5e1">图片路径修复</text></g>
      <g transform="translate(150 0)"><circle cx="10" cy="10" r="10" fill="none" stroke="url(#wg)" stroke-width="2.5"/><text x="10" y="15" text-anchor="middle" fill="#a855f7" font-size="14">5</text><text x="180" y="15" fill="#cbd5e1">生成报告</text></g>
    </g>
  </g>

  <!-- arrow 2 -->
  <line x1="764" y1="170" x2="824" y2="170" stroke="#818cf8" stroke-width="2.5" marker-end="url(#warrow)"/>

  <!-- STAGE 3: open in obsidian -->
  <g transform="translate(832 48)">
    <rect width="312" height="244" rx="16" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>
    <text x="24" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="26" font-weight="700" fill="#e2e8f0">③ 打开</text>
    <text x="24" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#a855f7">Obsidian Vault</text>
    <!-- destination doc + check -->
    <g transform="translate(24 96)">
      <rect x="24" y="0" width="70" height="52" rx="7" stroke="url(#wg)" stroke-width="3" fill="#0b1120"/>
      <line x1="34" y1="14" x2="84" y2="14" stroke="url(#wg)" stroke-width="2.5"/>
      <line x1="34" y1="24" x2="76" y2="24" stroke="url(#wg)" stroke-width="2.5"/>
      <line x1="34" y1="34" x2="80" y2="34" stroke="url(#wg)" stroke-width="2.5"/>
      <circle cx="104" cy="10" r="8" fill="#22c55e" opacity="0.9"/>
      <path d="M100 10 L103 13 L108 7" stroke="#030712" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="120" y="130" font-family="-apple-system,'PingFang SC','Segoe UI',sans-serif" font-size="17" fill="#94a3b8">Obsidian 打开</text>
    <text x="120" y="154" font-family="-apple-system,'PingFang SC','Segoe UI',sans-serif" font-size="17" fill="#94a3b8">笔记 · 图片 · 附件就绪</text>
    <text x="120" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#64748b">← wiznote_obsidian/</text>
  </g>
</svg>
